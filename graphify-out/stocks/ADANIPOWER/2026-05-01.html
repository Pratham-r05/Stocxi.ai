0.35},"title":"relates_to"},{"from":"ADANIPOWER|financial|Balance Sheet|Total Assets|2026-05-01","to":"ADANIPOWER|fundamental||Borrowings|2026-05-01","dashes":true,"width":1,"color":{"opacity":0.35},"title":"relates_to"},{"from":"ADANIPOWER|financial|P&L|Operating Profit|2026-05-01","to":"ADANIPOWER|fundamental||OPM|2026-05-01","dashes":true,"width":1,"color":{"opacity":0.35},"title":"relates_to"}];
const LEGEND    = [{"cid":0,"color":"#6B7280","label":"Neutral","count":82},{"cid":1,"color":"#00FF88","label":"Bullish","count":29},{"cid":2,"color":"#FF3355","label":"Bearish","count":19},{"cid":4,"color":"#4A90E2","label":"Category Hub","count":6},{"cid":5,"color":"#5B8DEF","label":"Sub-Group","count":5}];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _signal: n.signal, _value: n.value_text, _context: n.context,
  _type: n.node_type, _degree: n.degree, _community: n.community,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  dashes: e.dashes, width: e.width, color: e.color,
  title: e.title,
  arrows: { to: { enabled: true, scaleFactor: 0.4 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 200, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
  network.fit();
});

const SIG_CLASS = { positive:'sig-pos', negative:'sig-neg', neutral:'sig-neu', mixed:'sig-mix' };
const SIG_LABEL = { positive:'Bullish', negative:'Bearish', neutral:'Neutral', mixed:'Mixed' };

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const c  = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(c)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  const sigCls = SIG_CLASS[n._signal] || 'sig-neu';
  const sigLbl = SIG_LABEL[n._signal] || n._signal || '';
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b>${sigLbl ? ` <span class="${sigCls}">● ${sigLbl}</span>` : ''}</div>
    <div class="field" style="color:#555;font-size:11px">${esc(n._type)}</div>
    ${n._value ? `<div class="field" style="color:#aaa;margin-top:6px;font-size:12px">${esc(n._value)}</div>` : ''}
    ${n._context ? `<div class="field" style="color:#c9d1d9;font-size:11px;border-top:1px solid #2a2a4e;margin-top:8px;padding-top:8px">${esc(n._context)}</div>` : ''}
    ${neighborIds.length ? `<div class="field" style="margin-top:10px;color:#555;font-size:11px">Connected (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

window.focusNode = function(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
};

let hoveredNodeId = null;
network.on('hoverNode', p => { hoveredNodeId = p.node; container.style.cursor = 'pointer'; });
network.on('blurNode',  () => { hoveredNodeId = null;  container.style.cursor = 'default'; });
network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  }
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});

const searchInput   = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();
function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(el => hide ? el.classList.add('dimmed') : el.classList.remove('dimmed'));
  LEGEND.forEach(c => { if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid); });
  nodesDS.update(RAW_NODES.map(n => ({ id: n.id, hidden: hide })));
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${esc(c.label)}</span>
    <span class="legend-count">${c.count}</span>`;
  item.onclick = () => {
    if (hiddenCommunities.has(c.cid)) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    nodesDS.update(RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: hiddenCommunities.has(c.cid) })));
  };
  legendEl.appendChild(item);
});
</script>
