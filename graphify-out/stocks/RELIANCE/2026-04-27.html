function est(l){return EDGE_STYLES[l.type]||EDGE_STYLES.same_category;}

function makeNode(node){
  const g=new THREE.Group();
  const isV=node.community===5;
  const ew=node.effective_weight;
  const r=Math.max(2.2,Math.cbrt(node.val)*2.4);
  const c=new THREE.Color(node.color);

  g.add(new THREE.Mesh(
    new THREE.IcosahedronGeometry(r,isV?3:2),
    new THREE.MeshBasicMaterial({color:c,wireframe:false})
  ));

  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(r*1.7,16,12),
    new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:isV?0.30:0.18,
      blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false})
  ));

  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(r*3.2,12,8),
    new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:isV?0.10:0.05,
      blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false})
  ));

  if(isV){
    g.add(new THREE.Mesh(
      new THREE.TorusGeometry(r*2.4,0.35,16,64),
      new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.45,
        blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false})
    ));
    g.add(new THREE.Mesh(
      new THREE.TorusGeometry(r*3.2,0.2,12,48),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#ffffff'),transparent:true,opacity:0.12,
        blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false})
    ));
  }

  if(ew&&ew>0.6){
    const dotG=new THREE.RingGeometry(r*1.3,r*1.6,32);
    const dotM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,
      blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false});
    const ring=new THREE.Mesh(dotG,dotM);
    ring.rotation.x=Math.PI/2*0.7;ring.rotation.z=Math.PI/4;
    g.add(ring);
  }

  g.__nodeR=r;g.__pulse=isV?1:0;g.__nodeId=node.id;
  return g;
}

function nodeOpacity(n){
  if(!hlNodes.size)return 1.0;
  return hlNodes.has(n.id)?1.0:0.06;
}
function linkColor(l){
  if(!edgesVisible)return 'rgba(0,0,0,0)';
  if(!hlLinks.size)return est(l).color;
  return hlLinks.has(l)?est(l).color:'rgba(255,255,255,0.015)';
}
function linkWidth(l){
  if(!edgesVisible)return 0;
  const b=est(l).w;
  return hlLinks.size?(hlLinks.has(l)?b*2.2:0.06):b;
}
function particleCount(l){return est(l).p;}
function particleSpeed(l){return est(l).s;}
function particleWidth(l){
  const t=l.type;
  if(t==='AMPLIFIES'||t==='TRIGGERS')return 3.5;
  if(t==='verdict_support'||t==='CAUSES')return 2.5;
  return 1.5;
}

    const N=D.nodes.length;
    D.nodes.forEach((n,i)=>{
      const phi=Math.acos(-1+(2*i)/N),theta=Math.sqrt(N*Math.PI)*phi,R=260;
      n.fx=R*Math.cos(theta)*Math.sin(phi);n.fy=R*Math.sin(theta)*Math.sin(phi);n.fz=R*Math.cos(phi);
    });
    Graph.cameraPosition({x:0,y:0,z:700},{x:0,y:0,z:0},900);
  }else if(layoutMode===2){
    const comms={};
    D.nodes.forEach(n=>{(comms[n.community]=comms[n.community]||[]).push(n);});
    Object.keys(comms).forEach((cid,ci,keys)=>{
      const theta=(ci/keys.length)*2*Math.PI,R=320;
      comms[cid].forEach((n,ni)=>{
        const r=75,a=(ni/comms[cid].length)*2*Math.PI;
        n.fx=R*Math.cos(theta)+r*Math.cos(a);n.fy=R*Math.sin(theta)+r*Math.sin(a);
        n.fz=(Math.random()-.5)*120;
      });
    });
    Graph.cameraPosition({x:0,y:0,z:750},{x:0,y:0,z:0},900);
  }else{
    D.nodes.forEach(n=>{delete n.fx;delete n.fy;delete n.fz;});
    Graph.cameraPosition({x:0,y:0,z:600},{x:0,y:0,z:0},900);
  }
  Graph.graphData(D);
}
function filterCommunity(cid){
  hlNodes.clear();hlLinks.clear();
  const comm=D.communities.find(c=>c.id===cid);
  D.nodes.forEach(n=>{if(n.community===cid)hlNodes.add(n.id);});
  D.links.forEach(l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    if(hlNodes.has(s)&&hlNodes.has(t))hlLinks.add(l);
  });
  Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
  document.getElementById('node-info').innerHTML=
    `<div class="ni-label" style="color:${comm.color}">${comm.name}</div>
     <div class="ni-cat">Category filter</div>
     <div class="ni-val">${hlNodes.size} nodes &middot; ${hlLinks.size} connections</div>`;
}

document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  if(!q){
    hlNodes.clear();hlLinks.clear();
    Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
    document.getElementById('node-info').innerHTML='<div class="ni-placeholder">Click any node to inspect</div>';
    return;
  }
  hlNodes.clear();hlLinks.clear();
  const matched=D.nodes.filter(n=>
    n.label.toLowerCase().includes(q)||
    n.source_file.toLowerCase().includes(q)||
    n.value_text.toLowerCase().includes(q)||
    (n.context||'').toLowerCase().includes(q)
  );
  matched.forEach(n=>hlNodes.add(n.id));
  D.links.forEach(l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    if(hlNodes.has(s)||hlNodes.has(t)){hlLinks.add(l);hlNodes.add(s);hlNodes.add(t);}
  });
  Graph.nodeOpacity(n=>{
    if(!matched.length)return 1;
    return matched.some(m=>m.id===n.id)?1.0:hlNodes.has(n.id)?0.35:0.04;
  }).linkColor(linkColor).linkWidth(linkWidth);
  if(matched.length===1)showNodeInfo(matched[0],hlNodes.size-1);
  else document.getElementById('node-info').innerHTML=
    `<div class="ni-label" style="color:#818cf8">${matched.length} matches</div>
     <div class="ni-val">${matched.map(m=>m.label).slice(0,8).join(' &middot; ')}${matched.length>8?'...':''}</div>`;
});
</script>
