<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--surface:#1C1C1E;--surface-hover:#2C2C2E;
  --border:rgba(255,255,255,0.12);--border-focus:rgba(139,92,246,0.5);
  --text:#FFFFFF;--text-secondary:#FFFFFF;--text-muted:#A0A0A0;
  --accent:#8B5CF6;--accent-hover:#7C3AED;
  --head-color:#FFFFFF;--child-color:#6B7280;--verdict-color:#8B5CF6;
  --positive:#22C55E;--negative:#EF4444;--neutral:#9CA3AF;--mixed:#F59E0B;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
#graph{width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:1}

#header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;
  padding:16px 28px;text-align:center;pointer-events:none;
}
#header-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
#header-sub{font-size:12px;color:var(--text-muted);margin-top:2px;letter-spacing:0.5px}

#controls{
  position:fixed;top:16px;left:16px;z-index:100;
  background:rgba(28,28,30,0.94);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;min-width:170px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.ctrl-title{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:#FFFFFF;
  margin-bottom:10px;font-weight:700}
.ctrl-group{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.ctrl-group:last-child{margin-bottom:0}
button{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:#FFFFFF;
  padding:6px 10px;border-radius:7px;font-size:10px;font-weight:600;cursor:pointer;
  transition:all .18s;font-family:inherit;letter-spacing:0.3px}
button:hover{background:rgba(139,92,246,0.15);border-color:var(--border-focus);color:var(--accent)}
button.active{background:rgba(139,92,246,0.18);border-color:var(--border-focus);color:var(--accent)}
select{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:#FFFFFF;
  padding:6px 10px;border-radius:7px;font-size:10px;font-family:inherit;cursor:pointer;margin-top:2px;width:100%}
select option{background:#1C1C1E;color:#FFFFFF;}
select:focus{border-color:var(--border-focus);outline:none}

#tooltip{
  position:fixed;z-index:200;display:none;pointer-events:none;
  background:rgba(30,30,32,0.97);border:1px solid rgba(255,255,255,0.18);border-radius:10px;
  padding:14px 16px;max-width:340px;min-width:200px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.tt-label{font-size:14px;font-weight:700;color:#FFFFFF;line-height:1.3;margin-bottom:2px}
.tt-cat{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#A0A0A0;
  margin-top:2px;margin-bottom:8px}
.tt-divider{height:1px;background:rgba(255,255,255,0.12);margin:8px 0}
.tt-section{margin-bottom:6px}
.tt-section-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#A0A0A0;margin-bottom:2px}
.tt-value{font-size:12px;color:#FFFFFF;line-height:1.5;font-weight:500}
.tt-children{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tt-child-tag{font-size:9px;padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,0.08);color:#D1D5DB;border:1px solid rgba(255,255,255,0.1)}
.tt-row{display:flex;justify-content:space-between;font-size:11px;line-height:1.6;color:#A0A0A0}
.tt-row span:last-child{color:#FFFFFF;font-weight:600}
.tt-signal{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.sig-pos{background:var(--positive)}.sig-neg{background:var(--negative)}
.sig-neu{background:var(--neutral)}.sig-mix{background:var(--mixed)}

#stats{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;
  background:rgba(28,28,30,0.88);border:1px solid var(--border);border-radius:20px;
  padding:8px 20px;font-size:11px;color:var(--text-muted);
  display:flex;gap:12px;align-items:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
#stats strong{color:var(--accent);font-weight:700}
</style>

let rotating=true, showLabels=false, edgesVisible=true, layoutMode='force';
let hoveredNode=null;
const hlNodes=new Set(), hlLinks=new Set();

const SIGNAL_COLORS={
  positive:'#22C55E',bullish:'#22C55E',negative:'#EF4444',bearish:'#EF4444',
  neutral:'#9CA3AF',mixed:'#F59E0B'
};

const nodeMap={};

D.nodes.forEach(n=>{

let Graph;

function makeNode(node){
  const g=new THREE.Group();
  const nt=node.node_type||'child';
  let r;
  if(nt==='head') r=12;
  else if(nt==='group') r=8;
  else if(nt==='verdict') r=10;
  else r=5.5;

  if(nt==='head'){
    const core=new THREE.Mesh(
      new THREE.SphereGeometry(r,32,24),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#FFFFFF')})
    );
    g.add(core);
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(r*1.4,0.35,16,64),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#FFFFFF'),transparent:true,opacity:0.25})
    );
    ring.rotation.x=Math.PI/2;
    g.add(ring);
  } else if(nt==='group'){
    const fill=new THREE.Mesh(
      new THREE.SphereGeometry(r,24,16),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#3B82F6')})
    );
    g.add(fill);
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(r*1.25,0.25,16,64),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#60A5FA'),transparent:true,opacity:0.5})
    );
    ring.rotation.x=Math.PI/2;
    g.add(ring);
  } else if(nt==='verdict'){
    const shape=new THREE.Shape();
    const sides=6;
    for(let i=0;i<sides;i++){
      const a=(i/sides)*Math.PI*2-Math.PI/2;
      if(i===0)shape.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      else shape.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    shape.closePath();
    const hexGeo=new THREE.ExtrudeGeometry(shape,{depth:1.5,bevelEnabled:false});
    const hexMat=new THREE.MeshBasicMaterial({color:new THREE.Color('#8B5CF6')});
    const hexMesh=new THREE.Mesh(hexGeo,hexMat);
    hexMesh.position.z=-0.75;
    g.add(hexMesh);
    const sigColor=SIGNAL_COLORS[node.signal]||SIGNAL_COLORS.neutral;
    const dotGeo=new THREE.SphereGeometry(r*0.22,16,12);
    const dotMat=new THREE.MeshBasicMaterial({color:new THREE.Color(sigColor)});
    const dot=new THREE.Mesh(dotGeo,dotMat);
    dot.position.set(0,-r-2,0);
    g.add(dot);
  } else {
    const fill=new THREE.Mesh(
      new THREE.SphereGeometry(r,24,16),
      new THREE.MeshBasicMaterial({color:new THREE.Color('#374151')})
    );
    g.add(fill);
    const bc=SIGNAL_COLORS[node.signal]||SIGNAL_COLORS[node.border_color]||SIGNAL_COLORS[node.color]||'#9CA3AF';
    const border=new THREE.Mesh(
      new THREE.SphereGeometry(r*1.18,24,16),
      new THREE.MeshBasicMaterial({color:new THREE.Color(bc),transparent:true,opacity:0.45,wireframe:false})
    );
    g.add(border);
  }

  g.__nodeR=r;
  g.__nodeId=node.id;
  g.__nodeType=nt;
  return g;
}

function nodeOpacity(n){
  if(!hlNodes.size)return 1.0;
  return hlNodes.has(n.id)?1.0:0.06;
}
function linkColor(l){
  if(!edgesVisible)return 'rgba(0,0,0,0)';
  if(!hlLinks.size)return 'rgba(255,255,255,0.30)';
  return hlLinks.has(l)?'rgba(255,255,255,0.60)':'rgba(255,255,255,0.04)';
}
function linkWidth(l){
  if(!edgesVisible)return 0;
  if(!hlLinks.size)return 0.5;
  return hlLinks.has(l)?1.5:0.08;
}
function particleCount(l){
  if(!hlLinks.size)return 0;
  return hlLinks.has(l)?2:0;
}
function particleSpeed(){return 0.004;}

function showTooltip(node,x,y){
  const tt=document.getElementById('tooltip');
  const nt=node.node_type||'child';
  document.getElementById('tt-label').textContent=node.label||'';
  document.getElementById('tt-cat').textContent=(node.source_file||'').replace(' · ',', ');

  const descEl=document.getElementById('tt-desc-section');
  const descTextEl=document.getElementById('tt-desc');
  const valSection=document.getElementById('tt-val-section');
  const sigSection=document.getElementById('tt-sig-section');
  const ctxSection=document.getElementById('tt-ctx-section');
  const childrenEl=document.getElementById('tt-children');
  const wtRow=document.getElementById('tt-wt-row');
  const div1=document.getElementById('tt-divider-1');
  const div2=document.getElementById('tt-divider-2');

  valSection.style.display='none';
  sigSection.style.display='none';
  ctxSection.style.display='none';
  childrenEl.innerHTML='';
  childrenEl.style.display='none';
  wtRow.style.display='none';
  div1.style.display='block';
  div2.style.display='block';
  descEl.style.display='none';

  if(nt==='head'){
    const desc=node.context||'';
    descTextEl.textContent=desc;
    descEl.style.display='block';
    const kids=childrenMap[node.id]||[];
    if(kids.length>0){
      childrenEl.style.display='flex';
      kids.forEach(k=>{
        const tag=document.createElement('span');
        tag.className='tt-child-tag';
        tag.textContent=k.label;
        childrenEl.appendChild(tag);
      });
    }
    wtRow.style.display='flex';
    document.getElementById('tt-wt').textContent=kids.length+' items';
  } else if(nt==='group'){
    const desc=node.context||'';
    descTextEl.textContent=desc;
    descEl.style.display='block';
    const kids=childrenMap[node.id]||[];
    if(kids.length>0){
      childrenEl.style.display='flex';
      kids.forEach(k=>{
        const tag=document.createElement('span');
        tag.className='tt-child-tag';
        const sigDot=SIGNAL_COLORS[k.signal]||'#9CA3AF';
        tag.innerHTML='<span class="tt-signal" style="background:'+sigDot+';width:6px;height:6px;display:inline-block;border-radius:50%;margin-right:4px;vertical-align:middle"></span>'+k.label;
        childrenEl.appendChild(tag);
      });
    }
    wtRow.style.display='flex';
    document.getElementById('tt-wt').textContent=kids.length+' data points';
  } else if(nt==='verdict'){
    descEl.style.display='block';
    descTextEl.textContent=node.value_text||'';
    const sigColor=SIGNAL_COLORS[node.signal]||SIGNAL_COLORS.neutral;
    const sigLabel=(node.signal||'neutral').charAt(0).toUpperCase()+(node.signal||'neutral').slice(1);
    sigSection.style.display='block';
    document.getElementById('tt-sig').innerHTML='<span class="tt-signal" style="background:'+sigColor+'"></span>'+sigLabel;
    wtRow.style.display='flex';
    document.getElementById('tt-wt').textContent=node.weight?.toFixed(2)||'–';
  } else {
    const src=node.source_file||'';
    const isNewsOrAnn=src.startsWith('news')||src.startsWith('announcement');
    if(!isNewsOrAnn){
      valSection.style.display='block';
      document.getElementById('tt-val').textContent=node.value_text||'–';
    }
    sigSection.style.display='block';
    const sigColor=SIGNAL_COLORS[node.signal]||SIGNAL_COLORS.neutral;
    const sigLabel=(node.signal||'neutral').charAt(0).toUpperCase()+(node.signal||'neutral').slice(1);
    document.getElementById('tt-sig').innerHTML='<span class="tt-signal" style="background:'+sigColor+'"></span>'+sigLabel;
    ctxSection.style.display='block';
    const ctx=node.context||'';
    document.getElementById('tt-ctx').textContent=ctx.length>180?ctx.slice(0,177)+'...':ctx||'No context available';
    wtRow.style.display='flex';
    document.getElementById('tt-wt').textContent=node.effective_weight?(node.effective_weight*100).toFixed(1)+'%':node.weight?.toFixed(2)||'–';
  }

  tt.style.display='block';
  const maxW=340;
  let left=x+18;
  let top=y-12;
  if(left+maxW+20>window.innerWidth)left=x-maxW-18;
  if(top+280>window.innerHeight)top=window.innerHeight-290;
  if(top<10)top=10;
  tt.style.left=left+'px';
  tt.style.top=top+'px';
}
function hideTooltip(){
  document.getElementById('tooltip').style.display='none';
}

function createLabelSprite(node){
  const c=document.createElement('canvas');
  c.width=512;c.height=64;
  const ctx=c.getContext('2d');
  const txt=node.label.length>24?node.label.slice(0,22)+'...':node.label;
  ctx.fillStyle='rgba(28,28,30,0.92)';
  ctx.beginPath();ctx.roundRect(4,8,504,48,8);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(4,8,504,48,8);ctx.stroke();
  ctx.font='bold 22px Inter,system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFFFFF';
  ctx.fillText(txt,256,32);
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,depthWrite:false,transparent:true});
  const sprite=new THREE.Sprite(mat);
  const r=node.__nodeR||5;
  sprite.scale.set(40,6,1);
  sprite.position.set(0,r+7,0);
  return sprite;
}

function buildGraph(){
  Graph=ForceGraph3D()(document.getElementById('graph'))
    .graphData(D)
    .nodeId('id')
    .nodeLabel(node=>{
      const nt=node.node_type;
      if(nt==='head')return node.label+': '+(node.context||'');
      if(nt==='group')return node.label+': '+(node.context||'');
      return node.label;
    })
    .nodeThreeObject(makeNode)
    .nodeThreeObjectExtend(false)
    .nodeOpacity(nodeOpacity)
    .linkSource('source')
    .linkTarget('target')
    .linkColor(linkColor)
    .linkWidth(linkWidth)
    .linkOpacity(0.7)
    .linkDirectionalParticles(particleCount)
    .linkDirectionalParticleSpeed(particleSpeed)
    .linkDirectionalParticleWidth(1.5)
    .linkCurvature(0.05)
    .backgroundColor('#0A0A0A')
    .onNodeClick(node=>{
      hlNodes.clear();hlLinks.clear();
      if(node){
        hlNodes.add(node.id);
        D.links.forEach(l=>{
          const s=typeof l.source==='object'?l.source.id:l.source;
          const t=typeof l.target==='object'?l.target.id:l.target;
          if(s===node.id||t===node.id){hlLinks.add(l);hlNodes.add(s);hlNodes.add(t);}
        });
        if(node.node_type==='head'||node.node_type==='group'){
          const kids=childrenMap[node.id]||[];
          kids.forEach(k=>hlNodes.add(k.id));
        }
      }
      Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
      if(node){
        const d=130,m=Math.hypot(node.x||1,node.y||1,node.z||1),r=1+d/m;
        Graph.cameraPosition({x:node.x*r,y:node.y*r,z:node.z*r},node,900);
      }
    })
    .onNodeHover(node=>{
      canvas.style.cursor=node?'pointer':'default';
      if(node){
        hoveredNode=node;
        showTooltip(node,node.__screenX||0,node.__screenY||0);
      }else{
        hoveredNode=null;
        hideTooltip();
      }
    })
    .onBackgroundClick(()=>{
      hlNodes.clear();hlLinks.clear();
      Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
      hideTooltip();
    });

  canvas=document.querySelector('#graph canvas');

  if(showLabels)applyLabels();

  Graph.onEngineStop(()=>{
    const c=Graph.controls();if(c){c.autoRotate=rotating;c.autoRotateSpeed=0.5;}
  });

  setTimeout(()=>{
    const c=Graph.controls();
    if(c){c.autoRotate=true;c.autoRotateSpeed=0.5;c.enableDamping=true;c.dampingFactor=0.08;}
  },800);

  document.getElementById('sn').textContent=D.meta.node_count;
  document.getElementById('se').textContent=D.meta.edge_count;
  const activeCommunities=D.communities.filter(c=>
    D.nodes.some(n=>n.community===c.id));
  document.getElementById('sc').textContent=activeCommunities.length;
}

document.addEventListener('mousemove',function(e){
  if(hoveredNode){
    showTooltip(hoveredNode,e.clientX,e.clientY);
  }
},{passive:false});

function applyLabels(){
  if(!Graph)return;
  if(showLabels){
    Graph.nodeThreeObjectExtend(true).nodeThreeObject(node=>{
      const group=makeNode(node);
      group.add(createLabelSprite(node));
      return group;
    });
  }else{
    Graph.nodeThreeObjectExtend(false).nodeThreeObject(makeNode);
  }
}

function toggleLabels(){
  showLabels=!showLabels;
  document.getElementById('btn-labels').classList.toggle('active',showLabels);
  applyLabels();
}

function toggleEdges(){
  edgesVisible=!edgesVisible;
  document.getElementById('btn-edges').classList.toggle('active',edgesVisible);
  Graph.linkColor(linkColor).linkWidth(linkWidth).linkOpacity(edgesVisible?0.7:0);
}

function resetCamera(){
  Graph.cameraPosition({x:0,y:0,z:500},{x:0,y:0,z:0},900);
  hlNodes.clear();hlLinks.clear();
  Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
  hideTooltip();
}

function setLayout(mode){
  layoutMode=mode;
  document.getElementById('btn-force').classList.toggle('active',mode==='force');
  document.getElementById('btn-radial').classList.toggle('active',mode==='radial');
  document.getElementById('btn-hierarchy').classList.toggle('active',mode==='hierarchy');

  if(mode==='radial'){
    const heads=D.nodes.filter(n=>n.node_type==='head');
    const angleStep=(2*Math.PI)/Math.max(heads.length,1);
    heads.forEach((h,i)=>{
      const angle=i*angleStep;
      const R=280;
      h.fx=R*Math.cos(angle);h.fy=R*Math.sin(angle);h.fz=0;
    });
    const verdicts=D.nodes.filter(n=>n.node_type==='verdict');
    verdicts.forEach((v,vi)=>{
      const angle=vi*(2*Math.PI)/Math.max(verdicts.length,1);
      const R=400;
      v.fx=R*Math.cos(angle);v.fy=R*Math.sin(angle);v.fz=0;
    });
    D.nodes.filter(n=>n.node_type==='group').forEach(g=>{
      const parentId=g.parent;
      const parent=D.nodes.find(n=>n.id===parentId);
      if(parent&&parent.fx!=null){
        const offR=80+Math.random()*40;
        const offA=Math.random()*2*Math.PI;
        g.fx=parent.fx+offR*Math.cos(offA);
        g.fy=parent.fy+offR*Math.sin(offA);
        g.fz=(Math.random()-0.5)*60;
      }
    });
    D.nodes.filter(n=>n.node_type==='child').forEach(c=>{
      const parentId=c.parent;
      const parent=D.nodes.find(n=>n.id===parentId);
      if(parent&&parent.fx!=null){
        const offR=40+Math.random()*60;
        const offA=Math.random()*2*Math.PI;
        c.fx=parent.fx+offR*Math.cos(offA);
        c.fy=parent.fy+offR*Math.sin(offA);
        c.fz=(Math.random()-0.5)*80;
      }else{
        const offR=200+Math.random()*100;
        const offA=Math.random()*2*Math.PI;
        c.fx=offR*Math.cos(offA);
        c.fy=offR*Math.sin(offA);
        c.fz=(Math.random()-0.5)*100;
      }
    });
    Graph.cameraPosition({x:0,y:0,z:800},{x:0,y:0,z:0},900);
  }else if(mode==='hierarchy'){
    const heads=D.nodes.filter(n=>n.node_type==='head');
    const headSpread=150;
    heads.forEach((h,i)=>{
      const x=(i-(heads.length-1)/2)*headSpread;
      h.fx=x;h.fy=280;h.fz=0;
    });
    const verdicts=D.nodes.filter(n=>n.node_type==='verdict');
    verdicts.forEach((v,i)=>{
      const x=(i-(verdicts.length-1)/2)*headSpread;
      v.fx=x;v.fy=-300;v.fz=0;
    });
    D.nodes.filter(n=>n.node_type==='group').forEach(g=>{
      const parentId=g.parent;
      const parent=D.nodes.find(n=>n.id===parentId);
      if(parent&&parent.fx!=null){
        const siblings=D.nodes.filter(n=>n.parent===parentId&&n.node_type==='group');
        const idx=siblings.indexOf(g);
        const spread=40;
        g.fx=parent.fx+(idx-(siblings.length-1)/2)*spread;
        g.fy=parent.fy-80;
        g.fz=0;
      }
    });
    const groups=D.nodes.filter(n=>n.node_type==='group');
    const children=D.nodes.filter(n=>n.node_type==='child');
    const byParent={};
    children.forEach(c=>{
      const p=c.parent||'orphan';
      if(!byParent[p])byParent[p]=[];
      byParent[p].push(c);
    });
    Object.keys(byParent).forEach(pid=>{
      const parent=D.nodes.find(n=>n.id===pid);
      const baseX=parent?parent.fx:0;
      const baseY=parent?parent.fy:0;
      byParent[pid].forEach((c,ci)=>{
        const spread=20;
        const count=byParent[pid].length;
        c.fx=baseX+(ci-(count-1)/2)*spread;
        c.fy=baseY-60-Math.random()*80;
        c.fz=(Math.random()-0.5)*40;
      });
    });
    const orphans=byParent.orphan||[];
    orphans.forEach((c,i)=>{
      c.fx=(i-(orphans.length-1)/2)*30;
      c.fy=0;
      c.fz=(Math.random()-0.5)*100;
    });
    Graph.cameraPosition({x:0,y:0,z:900},{x:0,y:0,z:0},900);
  }else{
    D.nodes.forEach(n=>{delete n.fx;delete n.fy;delete n.fz;});
    Graph.cameraPosition({x:0,y:0,z:500},{x:0,y:0,z:0},900);
  }
  Graph.graphData(D);
}

function filterCategory(cat){
  hlNodes.clear();hlLinks.clear();
  if(cat==='all'){
    Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
    hideTooltip();
    return;
  }
  const headId='HEAD::'+cat;
  D.nodes.forEach(n=>{
    if(n.id===headId||n.node_type==='verdict'||n.community===2)hlNodes.add(n.id);
    if(n.parent===headId)hlNodes.add(n.id);
    if(n.node_type==='child'&&n.source_file&&n.source_file.startsWith(cat))hlNodes.add(n.id);
    if(n.node_type==='group'&&n.id.startsWith('GROUP::'+cat))hlNodes.add(n.id);
    if(n.parent&&n.parent.startsWith('GROUP::'+cat))hlNodes.add(n.id);
  });
  D.links.forEach(l=>{
    const s=typeof l.source==='object'?l.source.id:l.source;
    const t=typeof l.target==='object'?l.target.id:l.target;
    if(hlNodes.has(s)&&hlNodes.has(t))hlLinks.add(l);
  });
  Graph.nodeOpacity(nodeOpacity).linkColor(linkColor).linkWidth(linkWidth);
}

let touchCount=0;
document.addEventListener('touchstart',e=>{
  if(e.touches.length===3){e.preventDefault();return;}
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(e.touches.length===3){
    e.preventDefault();
    rotating=!rotating;
    const c=Graph.controls();if(c)c.autoRotate=rotating;
  }
},{passive:false});

buildGraph();
</script>
