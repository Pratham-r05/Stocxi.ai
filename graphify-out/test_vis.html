<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
<style>
body { margin: 0; }
#mynetwork { width: 100vw; height: 100vh; background: #0f0f1a; }
</style>
</head><body>
<div id="mynetwork"></div>
<script>
try {
  var nodes = new vis.DataSet([
    {id: 1, label: "Node 1", color: "#00FF88", font: {size: 14, color: "#ffffff"}},
    {id: 2, label: "Node 2", color: "#FF3355", font: {size: 14, color: "#ffffff"}},
  ]);
  var edges = new vis.DataSet([{from: 1, to: 2}]);
  var container = document.getElementById("mynetwork");
  var network = new vis.Network(container, {nodes: nodes, edges: edges}, {
    physics: { enabled: true, solver: "forceAtlas2Based" }
  });
  network.once("stabilizationIterationsDone", function() {
    network.setOptions({physics: {enabled: false}});
    network.fit();
  });
  document.title = "VIS TEST: OK";
} catch(e) {
  document.title = "VIS TEST: ERROR - " + e.message;
  document.body.innerHTML = "<h1 style='color:red'>Error: " + e.message + "</h1>";
}
</script>
</body></html>
