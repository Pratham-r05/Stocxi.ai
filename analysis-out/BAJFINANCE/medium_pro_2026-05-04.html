## About
Bajaj Finance Limited is one of India's largest and most diversified Non-Banking Financial Companies (NBFCs). The company's core business involves lending across multiple segments, including consumer finance (personal loans, durable finance), SME and commercial lending, and rural finance. Its extensive distribution network and technology-driven underwriting have enabled it to capture a significant market share in the retail credit space. The investment thesis for Bajaj Finance has historically been centered on its consistent high-growth trajectory, superior asset quality management, and strong profitability metrics, which have commanded a premium valuation in the market.

### MT Assessment
The medium-term outlook for Bajaj Finance is a high-stakes balance between proven profitability and structural cash burn.

-   **Fundamental Quality Grade (B-):** The company demonstrates A-grade profitability and growth metrics (Revenue/PAT CAGR >15%). However, the F-grade cash flow profile (deeply negative OCF/FCF) presents a significant structural risk, pulling the overall grade down.
-   **Earnings Trajectory:** The trajectory is one of stable acceleration, with FY26 PAT growth of 15.2% and latest quarterly PAT growth of 22.2%. The market expects this to continue, and any deceleration would likely trigger a valuation de-rating.
-   **Valuation:** The valuation is stretched. A PE of 31.1x and PB of 5.19x are pricing in flawless execution and continued high growth. This premium leaves little room for error, especially concerning asset quality or a slowdown in AUM growth.
-   **Technical Alignment:** Technicals are not yet fully aligned with the fundamental growth story. While momentum is positive, the stock is at a critical inflection point below its 200-day SMA. A failure to break above this level could signal prolonged consolidation.
-   **Highest-Conviction Signal:** The most critical signal is the conflict between \`Net_Profit_Annual\` and \`Operating_Cash_Flow\`. Historically, the market has rewarded Bajaj Finance for its P&L growth, but in a tightening liquidity environment, the focus could shift to cash generation, posing a risk to the premium valuation.
-   **Thesis Invalidation:** The medium-term bullish thesis would be invalidated by two primary triggers: 1) A sustained rise in Net NPAs above the 0.6% mark in the upcoming quarters, indicating credit quality stress. 2) A decisive technical breakdown below the 50-day SMA (currently ₹920), which would signal a loss of momentum.
