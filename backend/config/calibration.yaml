version: "2026.04.a"    # matches prompt_version from versions.yaml
method: "identity"      # identity | isotonic | linear
is_identity: true       # True = no calibration data yet, pass-through
fitted_at: null         # date of last calibration run
n_runs_used: 0
n_actionable: 0
overall_accuracy: null

bins: []
